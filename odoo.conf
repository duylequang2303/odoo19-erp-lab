[options]
; Mật khẩu master dùng để tạo/xóa database tại /web/database/manager
admin_passwd = admin

; Kết nối tới service PostgreSQL "db" trong docker-compose.yml
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo
; Để False để hiển thị danh sách database khi đăng nhập
db_name = False
list_db = True

; Đường dẫn addons: addon chuẩn của image + addon tự viết (mount từ ./addons)
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons

; Chế độ dev: tự reload code/QWeb, bật werkzeug debugger khi có lỗi
dev_mode = all

; Mức log chi tiết, in ra stdout (xem bằng: docker compose logs -f odoo)
log_level = info
logfile = None

; Cho phép nạp demo data để thử nghiệm nhanh
without_demo = False

; Môi trường dev dùng 1 worker (longpolling tắt)
workers = 0
